<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>真学生论坛</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{max-width:900px;margin:20px auto;padding:0 16px;background:#f5f5f5}
header{background:#222;color:#fff;padding:20px;border-radius:8px;margin-bottom:20px}
h1{font-size:26px}
.panel{background:#fff;padding:18px;border-radius:8px;margin-bottom:16px;box-shadow:0 1px 3px #0002}
textarea,input{width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:6px;font-size:16px}
button{padding:10px 16px;background:#2563eb;color:white;border:0;border-radius:6px;cursor:pointer;font-size:16px}
button:hover{background:#1d4ed8}
.post-item{border-bottom:1px solid #eee;padding:14px 0}
</style>
</head>
<body>
<header>
<h1>真学生论坛</h1>
<p>仓库：truestudents/truestudents</p>
</header>

<div class="panel">
<h3>发布新帖子</h3>
<input id="postTitle" placeholder="帖子标题">
<textarea id="postContent" rows="5" placeholder="在这里写帖子内容"></textarea>
<button onclick="submitPost()">提交帖子</button>
<div id="msg" style="margin-top:10px"></div>
</div>

<div class="panel">
<h3>帖子列表</h3>
<div id="postList"></div>
</div>

<script>
// ===== 配置项 =====
const TOKEN = "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";
const REPO_OWNER = "truestudents";
const REPO_NAME = "truestudents";
const BRANCH = "main";
// =================

function showMsg(text){document.getElementById("msg").innerText=text;}

async function submitPost(){
  const title = document.getElementById("postTitle").value.trim();
  const content = document.getElementById("postContent").value.trim();
  if(!title||!content){showMsg("标题和内容不能为空");return;}
  const fileName = `posts/${Date.now()}.md`;
  const fileContent = `# ${title}\n\n${content}`;
  try{
    const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${fileName}`,{
      method:"PUT",
      headers:{
        "Authorization":`token ${TOKEN}`,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        message:`发布帖子：${title}`,
        content:btoa(unescape(encodeURIComponent(fileContent))),
        branch:BRANCH
      })
    });
    const data = await res.json();
    if(res.ok){
      showMsg("✅发布成功！等待Pages刷新");
      document.getElementById("postTitle").value="";
      document.getElementById("postContent").value="";
    }else{
      showMsg(`❌请求失败：${data.message}`);
    }
  }catch(err){
    showMsg(`❌网络错误：${err}`);
  }
}
</script>
</body>
</html>
